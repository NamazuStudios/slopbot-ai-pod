{{/*
The ghcr image-pull secret — OPTIONAL, Helm-managed mode only (imagePullSecret.create = true).
The private pull credential is the designer's fine-grained PAT (read:packages) folded into a
docker config JSON; it is never committed — it arrives via --set-file at install/upgrade time.
Default mode (create = false): the PodTemplate references imagePullSecret.name, which the
designer loads out-of-band with `kubectl create secret docker-registry`.
*/}}
{{- if .Values.imagePullSecret.create }}
{{- if not .Values.imagePullSecret.dockerconfigjson }}
{{- fail "imagePullSecret.create is true but imagePullSecret.dockerconfigjson is empty — pass the full docker config JSON via --set-file imagePullSecret.dockerconfigjson=<file>, or load the secret with kubectl and set create = false" }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "slopbot-pod.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ required "dockerconfigjson is required" .Values.imagePullSecret.dockerconfigjson }}
{{- end }}
